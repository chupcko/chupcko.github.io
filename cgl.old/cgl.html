<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGL logo generator</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="tool">
<aside>
  <a class="back" href="index.html">&larr; CHUPCKO's Garage Lab</a>
  <h1>CGL logo</h1>
  <label for="unit" title="Size of one grid unit (mm). The letters are drawn on a 17 × 5 unit grid; at 1 mm the logo matches the original CGL.svg.">Unit (mm)</label>
  <input type="number" id="unit" value="10" min="0.1" step="0.5" title="Size of one grid unit (mm). The letters are drawn on a 17 × 5 unit grid; at 1 mm the logo matches the original CGL.svg.">
  <label for="stroke" title="Stroke width of all lines in the SVG (mm); laser software usually wants hairlines.">Line width (mm)</label>
  <input type="number" id="stroke" value="0.08" min="0.01" step="0.01" title="Stroke width of all lines in the SVG (mm); laser software usually wants hairlines.">
  <label for="color" title="Color of the letter contours — laser software assigns operations by color.">Logo color</label>
  <select id="color" title="Color of the letter contours — laser software assigns operations by color.">
    <option value="#000000" selected>Black</option>
    <option value="#ff0000">Red</option>
    <option value="#00ff00">Green</option>
    <option value="#0000ff">Blue</option>
  </select>
  <div class="chk" title="Draw the frame around the letters, one grid unit away on every side — as in the original logo.">
    <input type="checkbox" id="frame" checked>
    <label for="frame">Frame around logo</label>
  </div>
  <div id="frameRow">
    <label for="frameColor" title="Color of the frame rectangle — laser software assigns operations by color.">Frame color</label>
    <select id="frameColor" title="Color of the frame rectangle — laser software assigns operations by color.">
      <option value="#000000" selected>Black</option>
      <option value="#ff0000">Red</option>
      <option value="#00ff00">Green</option>
      <option value="#0000ff">Blue</option>
    </select>
  </div>
  <button id="download" title="Save the logo as an SVG file.">Download SVG</button>
  <div id="warnings"></div>
  <div class="hint">
    The CHUPCKO's Garage Lab logotype: C, G and L as single-line contours on
    a unit grid, with an optional frame. Hover any option for details.
  </div>
</aside>
<main>
  <div id="preview"></div>
</main>
<script src="js/svglib.js"></script>
<script src="js/cglgen.js"></script>
<script src="js/cgl.js"></script>
</body>
</html>
