<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruler generator</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="tool">
<aside>
  <a class="back" href="index.html">&larr; CHUPCKO's Garage Lab</a>
  <h1>Ruler</h1>
  <label for="length" title="Span of the scales between the margins. A bare number is millimeters; add mm, cm, in or &quot; for other units: 150, 15cm, 2.5&quot;, 2in, 1/2&quot;, 2-1/2&quot;, 2&quot;+3mm.">Length</label>
  <input type="text" id="length" value="150" title="Span of the scales between the margins. A bare number is millimeters; add mm, cm, in or &quot; for other units: 150, 15cm, 2.5&quot;, 2in, 1/2&quot;, 2-1/2&quot;, 2&quot;+3mm.">
  <div class="echo" id="lengthEcho"></div>
  <label for="marginL" title="Blank space before the scales; 0 = they start right at the cut edge. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/2&quot;, 2-1/2&quot;, 2&quot;+3mm).">Left margin</label>
  <input type="text" id="marginL" value="0" title="Blank space before the scales; 0 = they start right at the cut edge. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/2&quot;, 2-1/2&quot;, 2&quot;+3mm).">
  <div class="echo" id="marginLEcho"></div>
  <label for="marginR" title="Blank space after the scales. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/2&quot;, 2-1/2&quot;, 2&quot;+3mm).">Right margin</label>
  <input type="text" id="marginR" value="0" title="Blank space after the scales. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/2&quot;, 2-1/2&quot;, 2&quot;+3mm).">
  <div class="echo" id="marginREcho"></div>
  <label for="height" title="Height of the ruler body. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/2&quot;, 2-1/2&quot;, 2&quot;+3mm).">Height</label>
  <input type="text" id="height" value="25" title="Height of the ruler body. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/2&quot;, 2-1/2&quot;, 2&quot;+3mm).">
  <div class="echo" id="heightEcho"></div>

  <h2>Top edge</h2>
  <label for="topScale" title="Scale along the top edge: millimeters (1 mm / 5 mm / 1 cm ticks), inches divided binarily (1/2 … 1/16) or into tenths — or no scale.">Scale</label>
  <select id="topScale" title="Scale along the top edge: millimeters (1 mm / 5 mm / 1 cm ticks), inches divided binarily (1/2 … 1/16) or into tenths — or no scale.">
    <option value="none">None</option>
    <option value="mm" selected>Millimeters</option>
    <option value="inchbin">Inches — binary (1/2 … 1/16)</option>
    <option value="inchdec">Inches — decimal (1/10)</option>
  </select>
  <div id="topOpts">
    <label for="topDir" title="Which end the zero sits at: left to right is a normal scale, right to left measures from the right edge.">Direction</label>
    <select id="topDir" title="Which end the zero sits at: left to right is a normal scale, right to left measures from the right edge.">
      <option value="ltr" selected>Left to right</option>
      <option value="rtl">Right to left</option>
    </select>
    <div class="chk" title="Add the finest ticks: half millimeters, 1/32 inch on the binary scale or 1/20 on the decimal one.">
      <input type="checkbox" id="topFine">
      <label for="topFine" id="topFineLabel">Half-millimeter ticks</label>
    </div>
    <div id="topTick05Row">
      <label for="topTick05" title="Length of the finest tick: half millimeter, 1/32 or 1/20 inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Tiny tick</label>
      <input type="text" id="topTick05" value="2" title="Length of the finest tick: half millimeter, 1/32 or 1/20 inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
      <div class="echo" id="topTick05Echo"></div>
    </div>
    <label for="topTick1" title="Length of the smallest tick: 1 mm, 1/10 or 1/16 inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Small tick</label>
    <input type="text" id="topTick1" value="3" title="Length of the smallest tick: 1 mm, 1/10 or 1/16 inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
    <div class="echo" id="topTick1Echo"></div>
    <label for="topTick5" title="Length of the middle tick: 5 mm or 1/2 inch; the binary in-between levels scale between the small and middle tick. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Middle tick</label>
    <input type="text" id="topTick5" value="5" title="Length of the middle tick: 5 mm or 1/2 inch; the binary in-between levels scale between the small and middle tick. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
    <div class="echo" id="topTick5Echo"></div>
    <label for="topTick10" title="Length of the longest tick: 1 cm or a whole inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Long tick</label>
    <input type="text" id="topTick10" value="8" title="Length of the longest tick: 1 cm or a whole inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
    <div class="echo" id="topTick10Echo"></div>
    <div class="chk" title="Engrave numbers next to the longest ticks: 0 and centimeters or whole inches — single-stroke digits, engraving friendly.">
      <input type="checkbox" id="topLabels" checked>
      <label for="topLabels">Numbers (engrave)</label>
    </div>
    <div id="topLabelSizeRow">
      <label for="topLabelSize" title="Height of the engraved digits. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Number size</label>
      <input type="text" id="topLabelSize" value="3" title="Height of the engraved digits. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
      <div class="echo" id="topLabelSizeEcho"></div>
    </div>
    <div class="chk" id="topFlipRow" title="Rotate every digit 180° in place — for a ruler whose top scale is read with the ruler turned around.">
      <input type="checkbox" id="topFlip">
      <label for="topFlip">Digits upside down</label>
    </div>
  </div>

  <h2>Bottom edge</h2>
  <label for="botScale" title="Scale along the bottom edge: millimeters (1 mm / 5 mm / 1 cm ticks), inches divided binarily (1/2 … 1/16) or into tenths — or no scale.">Scale</label>
  <select id="botScale" title="Scale along the bottom edge: millimeters (1 mm / 5 mm / 1 cm ticks), inches divided binarily (1/2 … 1/16) or into tenths — or no scale.">
    <option value="none" selected>None</option>
    <option value="mm">Millimeters</option>
    <option value="inchbin">Inches — binary (1/2 … 1/16)</option>
    <option value="inchdec">Inches — decimal (1/10)</option>
  </select>
  <div id="botOpts">
    <label for="botDir" title="Which end the zero sits at: left to right is a normal scale, right to left measures from the right edge.">Direction</label>
    <select id="botDir" title="Which end the zero sits at: left to right is a normal scale, right to left measures from the right edge.">
      <option value="ltr" selected>Left to right</option>
      <option value="rtl">Right to left</option>
    </select>
    <div class="chk" title="Add the finest ticks: half millimeters, 1/32 inch on the binary scale or 1/20 on the decimal one.">
      <input type="checkbox" id="botFine">
      <label for="botFine" id="botFineLabel">Half-millimeter ticks</label>
    </div>
    <div id="botTick05Row">
      <label for="botTick05" title="Length of the finest tick: half millimeter, 1/32 or 1/20 inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Tiny tick</label>
      <input type="text" id="botTick05" value="2" title="Length of the finest tick: half millimeter, 1/32 or 1/20 inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
      <div class="echo" id="botTick05Echo"></div>
    </div>
    <label for="botTick1" title="Length of the smallest tick: 1 mm, 1/10 or 1/16 inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Small tick</label>
    <input type="text" id="botTick1" value="3" title="Length of the smallest tick: 1 mm, 1/10 or 1/16 inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
    <div class="echo" id="botTick1Echo"></div>
    <label for="botTick5" title="Length of the middle tick: 5 mm or 1/2 inch; the binary in-between levels scale between the small and middle tick. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Middle tick</label>
    <input type="text" id="botTick5" value="5" title="Length of the middle tick: 5 mm or 1/2 inch; the binary in-between levels scale between the small and middle tick. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
    <div class="echo" id="botTick5Echo"></div>
    <label for="botTick10" title="Length of the longest tick: 1 cm or a whole inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Long tick</label>
    <input type="text" id="botTick10" value="8" title="Length of the longest tick: 1 cm or a whole inch. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
    <div class="echo" id="botTick10Echo"></div>
    <div class="chk" title="Engrave numbers next to the longest ticks: 0 and centimeters or whole inches — single-stroke digits, engraving friendly.">
      <input type="checkbox" id="botLabels" checked>
      <label for="botLabels">Numbers (engrave)</label>
    </div>
    <div id="botLabelSizeRow">
      <label for="botLabelSize" title="Height of the engraved digits. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">Number size</label>
      <input type="text" id="botLabelSize" value="3" title="Height of the engraved digits. A bare number is millimeters; add mm, cm, in or &quot; for other units (1/8&quot;, 0.1in, 3mm).">
      <div class="echo" id="botLabelSizeEcho"></div>
    </div>
    <div class="chk" id="botFlipRow" title="Rotate every digit 180° in place — for a ruler whose bottom scale is read with the ruler turned around.">
      <input type="checkbox" id="botFlip">
      <label for="botFlip">Digits upside down</label>
    </div>
  </div>

  <h2>Output</h2>
  <label for="stroke" title="Stroke width of all lines in the SVG (mm); laser software usually wants hairlines.">Line width (mm)</label>
  <input type="number" id="stroke" value="0.08" min="0.01" step="0.01" title="Stroke width of all lines in the SVG (mm); laser software usually wants hairlines.">
  <label for="markColor" title="Color of the ticks and numbers — the engraving operation.">Marks color (engrave)</label>
  <select id="markColor" title="Color of the ticks and numbers — the engraving operation.">
    <option value="#000000" selected>Black</option>
    <option value="#ff0000">Red</option>
    <option value="#00ff00">Green</option>
    <option value="#0000ff">Blue</option>
  </select>
  <label for="boxColor" title="Color of the ruler outline — the cutting operation.">Outline color (cut)</label>
  <select id="boxColor" title="Color of the ruler outline — the cutting operation.">
    <option value="#ff0000" selected>Red</option>
    <option value="#000000">Black</option>
    <option value="#00ff00">Green</option>
    <option value="#0000ff">Blue</option>
  </select>
  <button id="download" title="Save the ruler as an SVG file.">Download SVG</button>
  <div id="warnings"></div>
  <div class="hint">
    An engraved ruler with an independent scale on each edge — unit,
    direction and upside-down digits per edge cover every way a ruler is
    printed and held. Every dimension accepts mm, cm, inches and
    fractions. Hover any option for details.
  </div>
</aside>
<main>
  <div id="preview"></div>
</main>
<script src="js/svglib.js"></script>
<script src="js/rulergen.js"></script>
<script src="js/ruler.js"></script>
</body>
</html>
