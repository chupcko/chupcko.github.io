<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Square mask generator</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="tool">
<aside>
  <a class="back" href="index.html">&larr; CHUPCKO's Garage Lab</a>
  <h1>Square mask</h1>
  <label for="grid" title="Classic keeps the rows aligned; staggered shifts every other row by half the spacing across (brick bond).">Arrangement</label>
  <select id="grid" title="Classic keeps the rows aligned; staggered shifts every other row by half the spacing across (brick bond).">
    <option value="classic" selected>Classic grid</option>
    <option value="stagger">Staggered — rows shifted by half</option>
  </select>
  <label for="mode" title="Give the area to fill (as many squares as fit, centered) or exact counts (the area follows).">Size given as</label>
  <select id="mode" title="Give the area to fill (as many squares as fit, centered) or exact counts (the area follows).">
    <option value="area" selected>Area dimensions</option>
    <option value="count">Square counts</option>
  </select>
  <div id="areaRow">
    <label for="width" title="Width of the area to fill with squares (mm).">Area width (mm)</label>
    <input type="number" id="width" value="100" min="1" step="1" title="Width of the area to fill with squares (mm).">
    <label for="height" title="Height of the area to fill with squares (mm).">Area height (mm)</label>
    <input type="number" id="height" value="100" min="1" step="1" title="Height of the area to fill with squares (mm).">
  </div>
  <div id="countRow">
    <label for="nx" title="Number of squares in a row.">Squares across</label>
    <input type="number" id="nx" value="10" min="1" step="1" title="Number of squares in a row.">
    <label for="ny" title="Number of rows.">Squares down</label>
    <input type="number" id="ny" value="10" min="1" step="1" title="Number of rows.">
  </div>
  <label for="spacingX" title="Center distance between neighboring squares in a row (mm).">Spacing across (mm, center to center)</label>
  <input type="number" id="spacingX" value="15" min="0.1" step="0.5" title="Center distance between neighboring squares in a row (mm).">
  <label for="spacingY" title="Center distance between rows (mm).">Spacing down (mm, center to center)</label>
  <input type="number" id="spacingY" value="15" min="0.1" step="0.5" title="Center distance between rows (mm).">
  <label for="side" title="Side length of every square (mm).">Square side (mm)</label>
  <input type="number" id="side" value="8" min="0.1" step="0.5" title="Side length of every square (mm).">
  <label for="angle" title="Rotation of every square around its own center (degrees); 45 gives diamonds. The material-bridge warning takes the angle into account.">Square angle (°)</label>
  <input type="number" id="angle" value="0" min="-90" max="90" step="5" title="Rotation of every square around its own center (degrees); 45 gives diamonds. The material-bridge warning takes the angle into account.">
  <label for="style" title="Outlines for cutting holes, filled squares for engraving.">Square style</label>
  <select id="style" title="Outlines for cutting holes, filled squares for engraving.">
    <option value="cut" selected>Outline (cut)</option>
    <option value="fill">Filled (engrave)</option>
  </select>
  <label for="stroke" title="Stroke width of the cut lines in the SVG (mm); laser software usually wants hairlines.">Cut line width (mm)</label>
  <input type="number" id="stroke" value="0.08" min="0.01" step="0.01" title="Stroke width of the cut lines in the SVG (mm); laser software usually wants hairlines.">
  <label for="color" title="Color of the squares — laser software assigns operations by color.">Square color</label>
  <select id="color" title="Color of the squares — laser software assigns operations by color.">
    <option value="#000000" selected>Black</option>
    <option value="#ff0000">Red</option>
    <option value="#00ff00">Green</option>
    <option value="#0000ff">Blue</option>
  </select>
  <div class="chk" title="Draw a rectangle around the pattern; the pattern is centered inside it.">
    <input type="checkbox" id="withBox">
    <label for="withBox">Box around pattern</label>
  </div>
  <div id="boxRow">
    <button type="button" id="fitBox" class="secondary" title="Set the box size to the pattern extent plus padding, rounded up to a round number.">Fit box to pattern</button>
    <label for="boxW" title="Width of the surrounding box (mm).">Box width (mm)</label>
    <input type="number" id="boxW" value="150" min="1" step="1" title="Width of the surrounding box (mm).">
    <label for="boxH" title="Height of the surrounding box (mm).">Box height (mm)</label>
    <input type="number" id="boxH" value="150" min="1" step="1" title="Height of the surrounding box (mm).">
    <label for="boxColor" title="Color of the box rectangle — laser software assigns operations by color.">Box color</label>
    <select id="boxColor" title="Color of the box rectangle — laser software assigns operations by color.">
      <option value="#000000" selected>Black</option>
      <option value="#ff0000">Red</option>
      <option value="#00ff00">Green</option>
      <option value="#0000ff">Blue</option>
    </select>
  </div>
  <button id="download" title="Save the pattern as an SVG file.">Download SVG</button>
  <div id="warnings"></div>
  <div class="hint">
    A grid of square holes at an angle — a plywood mask or grille. The
    warning reports thin material bridges between the holes. Hover any
    option for details.
  </div>
</aside>
<main>
  <div id="preview"></div>
</main>
<script src="js/svglib.js"></script>
<script src="js/squaresgen.js"></script>
<script src="js/squares.js"></script>
</body>
</html>
