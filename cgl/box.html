<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser-cut box generator</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="tool">
<aside>
  <a class="back" href="index.html">&larr; CHUPCKO's Garage Lab</a>
  <h1>Plywood box</h1>
  <label for="dims" title="Outer = overall size. Inner = usable space (walls added). True inner = pure compartment space (walls and dividers added) — mm values in the ratio fields come out exact.">Dimensions are</label>
  <select id="dims" title="Outer = overall size. Inner = usable space (walls added). True inner = pure compartment space (walls and dividers added) — mm values in the ratio fields come out exact.">
    <option value="outer" selected>Outer (overall size)</option>
    <option value="inner">Inner (usable space)</option>
    <option value="trueinner">True inner (without dividers)</option>
  </select>
  <label for="width" title="Box width (mm), interpreted per the dimensions choice above.">Base width (mm)</label>
  <input type="number" id="width" value="50" min="1" step="1" title="Box width (mm), interpreted per the dimensions choice above.">
  <label for="length" title="Box length (mm), interpreted per the dimensions choice above.">Base length (mm)</label>
  <input type="number" id="length" value="50" min="1" step="1" title="Box length (mm), interpreted per the dimensions choice above.">
  <label for="height" title="Box height (mm); the box is open at the top.">Box height (mm)</label>
  <input type="number" id="height" value="50" min="1" step="1" title="Box height (mm); the box is open at the top.">
  <label for="thickness" title="Plywood sheet thickness (mm) — also the depth of the fingers, holes and slots.">Plywood thickness (mm)</label>
  <input type="number" id="thickness" value="2" min="0.5" step="0.5" title="Plywood sheet thickness (mm) — also the depth of the fingers, holes and slots.">
  <label for="finger" title="Target width of one finger segment (mm); every joint edge gets an odd number of segments, at least 3.">Finger width (mm)</label>
  <input type="number" id="finger" value="10" min="1" step="1" title="Target width of one finger segment (mm); every joint edge gets an odd number of segments, at least 3.">
  <div class="chk" title="Slant the top: the front wall lower than the back one, side walls become trapezoids and flush dividers follow the slant.">
    <input type="checkbox" id="slope">
    <label for="slope">Sloped top (front wall lower)</label>
  </div>
  <div id="slopeRow">
    <label for="frontH" title="Height of the front wall (mm) — must be lower than the box height; the box height applies at the back.">Front height (mm)</label>
    <input type="number" id="frontH" value="30" min="1" step="1" title="Height of the front wall (mm) — must be lower than the box height; the box height applies at the back.">
  </div>
  <div class="chk" title="Add a grid of interlocking dividers; leave unchecked for a plain box. Dividers stand on the bottom, their end tabs go through holes in the walls, and crossings interlock with half-lap slots.">
    <input type="checkbox" id="dividers">
    <label for="dividers">Dividers</label>
  </div>
  <div id="dividerRow">
    <label for="cols" title="Number of compartments along the width; 1 = no dividers in this direction.">Compartments across width</label>
    <input type="number" id="cols" value="2" min="1" step="1" title="Number of compartments along the width; 1 = no dividers in this direction.">
    <label for="ratiosW" title="Optional compartment sizes: positive numbers separated by commas, scaled to fill the box (&quot;1,2,1&quot; equals &quot;30,60,30&quot;); overrides the count. With true inner dimensions the values are exact millimeters.">Width ratios (optional)</label>
    <input type="text" id="ratiosW" placeholder="e.g. 1,2,1 — overrides the count" title="Optional compartment sizes: positive numbers separated by commas, scaled to fill the box (&quot;1,2,1&quot; equals &quot;30,60,30&quot;); overrides the count. With true inner dimensions the values are exact millimeters.">
    <label for="rows" title="Number of compartments along the length; 1 = no dividers in this direction.">Compartments across length</label>
    <input type="number" id="rows" value="2" min="1" step="1" title="Number of compartments along the length; 1 = no dividers in this direction.">
    <label for="ratiosL" title="Optional compartment sizes: positive numbers separated by commas, scaled to fill the box (&quot;1,2,1&quot; equals &quot;30,60,30&quot;); overrides the count. With true inner dimensions the values are exact millimeters.">Length ratios (optional)</label>
    <input type="text" id="ratiosL" placeholder="e.g. 30,50 — overrides the count" title="Optional compartment sizes: positive numbers separated by commas, scaled to fill the box (&quot;1,2,1&quot; equals &quot;30,60,30&quot;); overrides the count. With true inner dimensions the values are exact millimeters.">
    <label for="divH" title="Divider height above the bottom panel (mm); 0 = flush with the box top.">Divider height (mm, 0 = flush with top)</label>
    <input type="number" id="divH" value="0" min="0" step="1" title="Divider height above the bottom panel (mm); 0 = flush with the box top.">
    <div class="chk" title="Tabs on the dividers' lower edge, one per compartment span, go through matching slots in the bottom panel — stiffer, but the slots show on the underside.">
      <input type="checkbox" id="anchor">
      <label for="anchor">Anchor dividers into the bottom</label>
    </div>
  </div>
  <label for="stroke" title="Stroke width of the cut lines in the SVG (mm); laser software usually wants hairlines.">Cut line width (mm)</label>
  <input type="number" id="stroke" value="0.08" min="0.01" step="0.01" title="Stroke width of the cut lines in the SVG (mm); laser software usually wants hairlines.">
  <label for="color" title="Color of the cut lines — laser software assigns operations by color.">Cut color</label>
  <select id="color" title="Color of the cut lines — laser software assigns operations by color.">
    <option value="#000000" selected>Black</option>
    <option value="#ff0000">Red</option>
    <option value="#00ff00">Green</option>
    <option value="#0000ff">Blue</option>
  </select>
  <label for="layout" title="Panel arrangement. Joined puts the walls in one strip where neighboring panels share their joint edge, so the laser cuts both profiles in one pass; separate spaces every panel apart. Dividers always sit below the box block.">Panel layout</label>
  <select id="layout" title="Panel arrangement. Joined puts the walls in one strip where neighboring panels share their joint edge, so the laser cuts both profiles in one pass; separate spaces every panel apart. Dividers always sit below the box block.">
    <option value="strip" selected>Joined</option>
    <option value="separate">Separate panels</option>
  </select>
  <div class="chk" title="Show the assembled box in 3D — every part gets its own color so the joints are visible. Drag to rotate, scroll to zoom.">
    <input type="checkbox" id="view3d">
    <label for="view3d">3D preview (assembled)</label>
  </div>
  <div class="chk" title="Engrave a number at every joint — the same number marks the two parts that fit together: 1–8 on the box edges, 9 and up pairing each divider end with its wall holes.">
    <input type="checkbox" id="labels">
    <label for="labels">Joint numbers (engrave)</label>
  </div>
  <div id="labelSizeRow">
    <label for="labelSize" title="Height of the engraved digits (mm).">Joint number size (mm)</label>
    <input type="number" id="labelSize" value="3" min="1" step="0.5" title="Height of the engraved digits (mm).">
    <label for="numColor" title="Color of the engraved numbers — use a different color than the cuts so the laser can engrave them.">Joint number color</label>
    <select id="numColor" title="Color of the engraved numbers — use a different color than the cuts so the laser can engrave them.">
      <option value="#000000" selected>Black</option>
      <option value="#ff0000">Red</option>
      <option value="#00ff00">Green</option>
      <option value="#0000ff">Blue</option>
    </select>
  </div>
  <button id="download" title="Save the template as an SVG file.">Download SVG</button>
  <div id="warnings"></div>
  <div class="hint">
    The finger-joint box, open at the top: bottom + 4 sides, with an
    optional divider grid. Hover any option for details. For a tighter fit,
    set the kerf in your laser software.
  </div>
</aside>
<main>
  <div id="preview"></div>
  <div id="preview3d" style="display:none"></div>
</main>
<script src="js/svglib.js"></script>
<script src="js/boxgen.js"></script>
<script src="js/divboxgen.js"></script>
<script src="js/box.js"></script>
<script type="module" src="js/box3d.js"></script>
</body>
</html>
