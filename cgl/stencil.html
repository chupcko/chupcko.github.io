<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser stencil text generator</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="tool">
<aside>
  <a class="back" href="index.html">&larr; CHUPCKO's Garage Lab</a>
  <h1>Stencil text</h1>
  <label for="text">Text</label>
  <input type="text" id="text" value="STENCIL">
  <label for="sizeMode">Given dimension</label>
  <select id="sizeMode">
    <option value="width" selected>Text width</option>
    <option value="height">Text height</option>
  </select>
  <label for="sizeValue">Value (mm)</label>
  <input type="number" id="sizeValue" value="100" min="1" step="1">
  <div id="computed"></div>
  <label for="stroke">Line width (mm)</label>
  <input type="number" id="stroke" value="0.08" min="0.01" step="0.01">
  <label for="color">Text color</label>
  <select id="color">
    <option value="#000000" selected>Black</option>
    <option value="#ff0000">Red</option>
    <option value="#00ff00">Green</option>
    <option value="#0000ff">Blue</option>
  </select>
  <div class="chk">
    <input type="checkbox" id="withBox">
    <label for="withBox">Box around text</label>
  </div>
  <div id="boxRow">
    <button type="button" id="fitBox" class="secondary">Fit box to text</button>
    <label for="boxW">Box width (mm)</label>
    <input type="number" id="boxW" value="120" min="1" step="1">
    <label for="boxH">Box height (mm)</label>
    <input type="number" id="boxH" value="40" min="1" step="1">
    <label for="boxColor">Box color</label>
    <select id="boxColor">
      <option value="#000000" selected>Black</option>
      <option value="#ff0000">Red</option>
      <option value="#00ff00">Green</option>
      <option value="#0000ff">Blue</option>
    </select>
  </div>
  <button id="download">Download SVG</button>
  <div id="warnings"></div>
  <div class="hint">
    Text is rendered as vector outlines of Stencil Std Bold, parsed from the
    font file in the browser. Text and the optional box use the chosen
    colors — different colors let each part get its own laser operation.
    Text is centered inside the box.
  </div>
</aside>
<main>
  <div id="preview"></div>
</main>
<script src="js/svglib.js"></script>
<script src="js/font.js"></script>
<script src="js/textgen.js"></script>
<script src="js/stencil.js"></script>
</body>
</html>
