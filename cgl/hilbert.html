<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilbert curve generator</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="tool">
<aside>
  <a class="back" href="index.html">&larr; CHUPCKO's Garage Lab</a>
  <h1>Hilbert curve</h1>
  <label for="size">Square size (mm)</label>
  <input type="number" id="size" value="100" min="1" step="1">
  <label for="order">Iterations</label>
  <input type="number" id="order" value="4" min="1" max="10" step="1">
  <label for="stroke">Line width (mm)</label>
  <input type="number" id="stroke" value="0.08" min="0.01" step="0.01">
  <label for="color">Curve color</label>
  <select id="color">
    <option value="#000000" selected>Black</option>
    <option value="#ff0000">Red</option>
    <option value="#00ff00">Green</option>
    <option value="#0000ff">Blue</option>
  </select>
  <div class="chk">
    <input type="checkbox" id="withBox">
    <label for="withBox">Box around curve</label>
  </div>
  <div id="boxRow">
    <button type="button" id="fitBox" class="secondary">Fit box to curve</button>
    <label for="boxW">Box width (mm)</label>
    <input type="number" id="boxW" value="150" min="1" step="1">
    <label for="boxH">Box height (mm)</label>
    <input type="number" id="boxH" value="150" min="1" step="1">
    <label for="boxColor">Box color</label>
    <select id="boxColor">
      <option value="#000000" selected>Black</option>
      <option value="#ff0000">Red</option>
      <option value="#00ff00">Green</option>
      <option value="#0000ff">Blue</option>
    </select>
  </div>
  <button id="download">Download SVG</button>
  <div id="warnings"></div>
  <div class="hint">
    A space-filling Hilbert curve drawn as a single polyline that fills the
    given square. Each iteration doubles the grid density — mind the line
    width at high iteration counts. The curve is centered inside the
    optional box.
  </div>
</aside>
<main>
  <div id="preview"></div>
</main>
<script src="js/svglib.js"></script>
<script src="js/hilbertgen.js"></script>
<script src="js/hilbert.js"></script>
</body>
</html>
